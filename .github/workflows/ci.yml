name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Pandoc
        run: brew install pandoc

      - name: Show tool versions
        run: |
          swift --version
          pandoc --version | head -1

      - name: Run tests
        run: swift test

      - name: Build universal app and CLI
        run: ./build.sh release

      - name: Verify generated app bundle
        run: scripts/verify_bundle.sh "Poor Man's Text.app"
