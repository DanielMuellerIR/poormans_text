name: Publish Sparkle appcast

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Already published release tag, for example v0.8.0
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sparkle-appcast
  cancel-in-progress: false

jobs:
  appcast:
    # Derselbe Runner wie in ci.yml: Package.swift verlangt swift-tools-version
    # 6.2, ältere Images bringen dafür kein passendes Xcode mit.
    runs-on: macos-26
    # Ein Prerelease darf nie in den Produktions-Feed: Sparkle bietet den
    # veröffentlichten Appcast allen normalen Installationen an.
    if: github.event_name != 'release' || github.event.release.prerelease == false
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      # Die Actions hängen an geprüften Commit-SHAs statt an beweglichen
      # Major-Tags: Ein Tag kann jederzeit auf anderen Code umgesetzt werden,
      # der dann im selben Lauf wie die Signatur ausgeführt würde.
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      # Auch ein Lauf von Hand darf den Feed nicht auf einen alten oder
      # unfertigen Stand zurücksetzen.
      - name: Verify the release tag is the latest stable release
        shell: bash
        run: |
          set -euo pipefail
          state="$(gh release view "$RELEASE_TAG" \
            --json isDraft,isPrerelease \
            --jq '[.isDraft, .isPrerelease] | @tsv')"
          IFS=$'\t' read -r is_draft is_prerelease <<< "$state"
          if [[ "$is_draft" != "false" ]] || [[ "$is_prerelease" != "false" ]]; then
            echo "FEHLER: $RELEASE_TAG ist ein Entwurf oder Prerelease." >&2
            exit 1
          fi
          # "Neuestes stabiles Release" ueber die API pruefen statt ueber das
          # gh-Feld isLatest: die gh-Version des Runners kennt das Feld nicht
          # (belegt im fehlgeschlagenen Lauf zu v0.8.1 am 2026-08-07).
          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          if [[ "$latest_tag" != "$RELEASE_TAG" ]]; then
            echo "FEHLER: $RELEASE_TAG ist nicht das neueste stabile Release (das ist $latest_tag)." >&2
            exit 1
          fi

      - name: Download release disk image and release notes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p update site
          gh release download "$RELEASE_TAG" --pattern '*.dmg' --dir update

          shopt -s nullglob
          dmgs=(update/*.dmg)
          if (( ${#dmgs[@]} != 1 )); then
            echo "FEHLER: Release $RELEASE_TAG muss genau ein DMG enthalten." >&2
            exit 1
          fi

          # Gleicher Basisname: generate_appcast ordnet die Markdown-Datei dem DMG zu.
          gh release view "$RELEASE_TAG" --json body --jq .body > "${dmgs[0]%.dmg}.md"

      # Der private Update-Schlüssel steht nur in diesem einen Schritt. Im
      # Job-`env` wäre er auch für Checkout, Pages-Actions und Deployment
      # sichtbar — eine unbemerkt veränderte Action könnte ihn dort auslesen und
      # damit fremde Updates gültig signieren.
      - name: Generate signed appcast
        shell: bash
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "FEHLER: GitHub-Secret SPARKLE_PRIVATE_KEY fehlt." >&2
            exit 1
          fi

          swift package resolve
          tool="$(find .build/artifacts/sparkle -type f -name generate_appcast -print -quit)"
          if [[ -z "$tool" ]]; then
            echo "FEHLER: Sparkles generate_appcast wurde nicht gefunden." >&2
            exit 1
          fi

          # Der geheime Schlüssel steht weder in argv noch in einer Datei oder im Log.
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$tool" \
            --ed-key-file - \
            --embed-release-notes \
            --maximum-versions 1 \
            --maximum-deltas 0 \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/" \
            --link "https://github.com/${GITHUB_REPOSITORY}" \
            -o "$PWD/site/appcast.xml" \
            "$PWD/update"

          xmllint --noout site/appcast.xml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

      - name: Publish appcast on GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
