<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Word-processing fixture</title>
</head>
<body>
  <h1>Fixture heading ä</h1>
  <p>This paragraph contains <strong>bold text</strong>, <em>italic text</em>,
    and an <a href="https://example.com/document">external link</a>.</p>
  <ul>
    <li>First list item</li>
    <li>Second list item</li>
  </ul>
  <table>
    <thead><tr><th>Name</th><th>Value</th></tr></thead>
    <tbody>
      <tr><td>Äpfel</td><td>12</td></tr>
      <tr><td>Birnen</td><td>7</td></tr>
    </tbody>
  </table>
  <p><img src="fixture.png" alt="Embedded fixture image"></p>
  <p>Final paragraph: Grüße aus Köln.</p>
</body>
</html>
